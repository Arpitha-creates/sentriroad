version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=change-this-in-production
      - AI_SERVICE_URL=http://ai-service:5001
    depends_on:
      - ai-service

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    ports:
      - "5001:5001"
    environment:
      - AI_SERVICE_PORT=5001
      - INFERENCE_MODE=mock

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mock-server:
    build:
      context: .
      dockerfile: docker/mock-server.Dockerfile
    ports:
      - "4001:4000"
    profiles:
      - mock
